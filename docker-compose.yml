services:
  db:
    image: postgres:17-alpine
    container_name: habit-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: habit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-habit}
      POSTGRES_DB: habit_tracker
    ports:
      # Bound to localhost by default so the database is not reachable from the
      # local network. Set DB_BIND=0.0.0.0 only if you need remote psql.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habit -d habit_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: habit-tracker-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://habit:${DB_PASSWORD:-habit}@db:5432/habit_tracker
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      # The app has no authentication, so it is only exposed on localhost by
      # default. Set APP_BIND=0.0.0.0 (and put auth in front of it first).
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db-data:
